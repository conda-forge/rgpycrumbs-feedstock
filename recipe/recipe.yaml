schema_version: 1

context:
  name: rgpycrumbs
  version: "1.10.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/rgpycrumbs/rgpycrumbs-${{ version }}.tar.gz
  sha256: 13c538266656f01981a24a192527522da56f9df08b5536b02c85dc7ed1af7cf1

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - click
    - numpy
    - rich

tests:
  - python:
      imports:
        - rgpycrumbs
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://github.com/HaoZeke/rgpycrumbs
  summary: Dispatcher-based analytical and visualization suite for chemical physics
  license: MIT
  license_file: LICENSE
  repository: https://github.com/HaoZeke/rgpycrumbs

extra:
  recipe-maintainers:
    - HaoZeke
